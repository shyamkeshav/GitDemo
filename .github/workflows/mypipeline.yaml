name : test_work-flow
on:
  workflow_dispatch

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: my_flow_for_ubuntu
        run: echo "this is an echo output"

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: my_flow_for_ubuntu_python
        shell: python
        run: print("Hello python")