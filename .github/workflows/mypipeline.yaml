name: my_practise_pipeline

on:
  workflow_dispatch:

jobs:
  my_uploads_job:
    runs-on: ubuntu-latest
    outputs:
      sum_result : ${{ steps.summation.uploads.result }}
    steps:
      - name: upload_step
        id: summation 
        shell: python
        run: |
          import os
          num1 = 20
          num2 = 30
          result = num1+num2

          print(f"summation result is {result}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
               print(f"result={result}", file=fh)
  my_upoad_value_usage:
    runs-on: ubuntu-latest
    needs: my_uploads_job
    steps:
      - name: print summation result
        env:
          RESULT: ${{ needs.my_uploads_job.outputs.sum_result }}
        run: |
          echo "result is ${RESULT}"



